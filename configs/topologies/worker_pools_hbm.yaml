schema_version: 2

topology:
  name: Worker Pools with HBM Caches
  description: >
    Prefill and decode worker pools each connected to a dedicated HBM cache
    over PCIe. No internal NVLink/NVSwitch modeling inside the pools.

defaults:
  pcie:
    generation: Gen4
    width: x16
    mps: 256
    mrrs: 512
    base_latency_us: 0.5
    switch_hops: 0
    congestion_factor: 1.0
    protocol_efficiency: 0.95
    switch_hop_latency_us: 0.15
    read_request_latency_us: 0.2
    memory_service_latency_us: 0.5
    endpoint_processing_us: 0.1
    memory_processing_us: 0.1
    congestion_base_penalty_us: 0.05
  dma:
    queue_depth: 64
    max_outstanding_reads: 16
    request_size: 4096
    completion_size: 4096
    read_latency_us: 0.1
    write_latency_us: 0.05
  nvlink:
    version: NVLink4
    links: 18
    bandwidth_per_link_GBps: 50.0
    aggregate_bandwidth_GBps: 900.0
    latency_us: 0.5
    bidirectional: true
    congestion_factor: 1.0
    protocol_efficiency: 0.95
  infiniband:
    generation: NDR
    signaling_rate_gbps: 400.0
    lanes: 4
    raw_bandwidth_GBps: 50.0
    effective_bandwidth_GBps: 47.5
    latency_us: 2.0
    mtu_bytes: 4096
    rdma_enabled: true
    protocol_efficiency: 0.95
    congestion_factor: 1.0

nodes:
  - id: prefill_pool
    name: Prefill Worker Pool
    type: PREFILL_POOL
    position: {x: -240, y: 120}
    config:
      worker_count: 4
      gpu_preset: h100_sxm
      workload_rate_rps: 1000
      metadata_ops_rate: 16000
      kv_blocks_owned: 65536
      attached_hbm_node_id: prefill_hbm

  - id: prefill_hbm
    name: Prefill HBM Cache
    type: HBM_MEMORY
    position: {x: -240, y: -40}
    config:
      sku: HBM3 80 GB
      capacity_gb: 80
      bandwidth_GBps: 3350
      stacks: 5
      channels: 5
      read_latency_ns: 100
      write_latency_ns: 100
      generation: HBM3
      power_w: 60

  - id: decode_pool
    name: Decode Worker Pool
    type: DECODE_POOL
    position: {x: 240, y: 120}
    config:
      worker_count: 4
      gpu_preset: h100_sxm
      workload_rate_rps: 2000
      metadata_ops_rate: 32000
      kv_blocks_owned: 65536
      attached_hbm_node_id: decode_hbm

  - id: decode_hbm
    name: Decode HBM Cache
    type: HBM_MEMORY
    position: {x: 240, y: -40}
    config:
      sku: HBM3 80 GB
      capacity_gb: 80
      bandwidth_GBps: 3350
      stacks: 5
      channels: 5
      read_latency_ns: 100
      write_latency_ns: 100
      generation: HBM3
      power_w: 60

links:
  - id: prefill_pool_hbm
    source: prefill_pool
    dest: prefill_hbm
    interconnect: PCIe
    bidirectional: true
    enabled: true
    serialization_enabled: true
    congestion_factor: 1.0

  - id: decode_pool_hbm
    source: decode_pool
    dest: decode_hbm
    interconnect: PCIe
    bidirectional: true
    enabled: true
    serialization_enabled: true
    congestion_factor: 1.0
