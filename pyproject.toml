[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kv-metadata-engine"
version = "0.1.0"
description = "KV metadata placement engine design-space exploration tool"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["model"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
